plugins {
    id 'com.android.application'
}

def autoVersionCode = System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1

android {
    namespace 'com.roge.store'
    compileSdk 34

    defaultConfig {
        applicationId "com.roge.store"
        minSdk 21
        targetSdk 34
        versionCode autoVersionCode
        versionName "1." + autoVersionCode
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
