plugins {
    id 'com.android.application'
}

def autoVersionCode = 1000 + (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)

android {
    namespace 'com.roge.store'
    compileSdk 34

    defaultConfig {
        applicationId "com.roge.store"
        minSdk 21
        targetSdk 28
        versionCode autoVersionCode
        versionName "1.0." + autoVersionCode
    }

    signingConfigs {
        rogeKey {
            storeFile file("../roge.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.rogeKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.rogeKey
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
