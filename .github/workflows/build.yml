name: Build & Auto-Deploy Roge Store APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Pastikan roge.keystore Permanen Tersedia
        run: |
          if [ ! -f "roge.keystore" ]; then
            echo "Membuat roge.keystore permanen..."
            keytool -genkey -v -keystore roge.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RogeStore, OU=TV, O=RogeProject, L=Padang, S=Sumbar, C=ID"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin ${{ github.ref_name }}
            git add roge.keystore
            git commit -m "Simpan roge.keystore permanen [skip ci]"
            git push origin ${{ github.ref_name }}
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Clean & Build APK
        run: gradle clean assembleDebug --no-daemon

      - name: Kirim APK Otomatis ke VPS (rogeproject.my.id)
        run: |
          VER_CODE=$((1000 + ${{ github.run_number }}))
          RESPONSE=$(curl -s -X POST "https://rogeproject.my.id/store/admin.php" \
            -F "github_auto_deploy=1" \
            -F "secret_key=${{ secrets.STORE_SECRET }}" \
            -F "version_code=$VER_CODE" \
            -F "store_apk=@app/build/outputs/apk/debug/app-debug.apk")
          echo "Versi dikirim: $VER_CODE | Respon Server VPS: $RESPONSE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogeStore-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
