name: Build & Auto-Deploy Roge Store APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Olah Otomatis Gambar Drawable & Kartu Ikon TV
        run: |
          python3 -m pip install --break-system-packages -q pillow
          python3 - << 'PYEOF'
          import os, re
          from PIL import Image, ImageDraw

          d = "app/src/main/res/drawable"
          os.makedirs(d, exist_ok=True)

          for f in list(os.listdir(d)):
              p = os.path.join(d, f)
              if not os.path.isfile(p):
                  continue
              if f.startswith(".") or not f.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                  os.remove(p)
                  continue
              base = re.sub(r"[^a-z0-9_]", "_", os.path.splitext(f)[0].lower())
              out_p = os.path.join(d, base + ".png")
              img = Image.open(p).convert("RGBA")
              if p != out_p:
                  os.remove(p)
              img.save(out_p, "PNG")

          bg_path = os.path.join(d, "bg.png")
          if os.path.exists(bg_path):
              bg = Image.open(bg_path).convert("RGB")
              bg = bg.resize((1280, 720), Image.LANCZOS)
              bg.save(bg_path, "PNG")

          banner_path = os.path.join(d, "banner.png")
          if os.path.exists(banner_path):
              b_img = Image.open(banner_path).convert("RGBA")
              bbox = b_img.getbbox()
              if bbox:
                  b_img = b_img.crop(bbox)
              b_img.save(banner_path, "PNG")

          logo_path = os.path.join(d, "logo.png")
          if not os.path.exists(logo_path):
              Image.new("RGBA", (256, 256), (0, 229, 255, 255)).save(logo_path, "PNG")

          # Buat kartu ikon layar depan Android TV (320x180 penuh dengan Logo Roge Store di tengah)
          tv_banner_path = os.path.join(d, "tv_banner.png")
          tv_b = Image.new("RGBA", (320, 180), (5, 28, 42, 255))
          draw = ImageDraw.Draw(tv_b)
          for y in range(180):
              r = int(4 + (y / 180.0) * 6)
              g = int(24 + (y / 180.0) * 32)
              b = int(38 + (y / 180.0) * 44)
              draw.line([(0, y), (320, y)], fill=(r, g, b, 255))

          lg = Image.open(logo_path).convert("RGBA")
          lbbox = lg.getbbox()
          if lbbox:
              lg = lg.crop(lbbox)
          lg.thumbnail((250, 145), Image.LANCZOS)
          tv_b.paste(lg, ((320 - lg.width) // 2, (180 - lg.height) // 2), lg)
          tv_b.save(tv_banner_path, "PNG")

          print("Final drawable:", os.listdir(d))
          PYEOF

      - name: Pastikan roge.keystore Permanen Tersedia
        run: |
          if [ ! -f "roge.keystore" ]; then
            keytool -genkey -v -keystore roge.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RogeStore, OU=TV, O=RogeProject, L=Padang, S=Sumbar, C=ID"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add roge.keystore
            git commit -m "Simpan roge.keystore permanen [skip ci]" || true
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || echo "Skip push keystore"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Clean & Build APK
        run: gradle clean assembleDebug --no-daemon

      - name: Kirim APK Otomatis ke VPS (rogeproject.my.id)
        run: |
          VER_CODE=$((1000 + ${{ github.run_number }}))
          RESPONSE=$(curl -s -X POST "https://rogeproject.my.id/store/admin.php" -F "github_auto_deploy=1" -F "secret_key=${{ secrets.STORE_SECRET }}" -F "version_code=$VER_CODE" -F "store_apk=@app/build/outputs/apk/debug/app-debug.apk")
          echo "Versi dikirim: $VER_CODE | Respon Server VPS: $RESPONSE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogeStore-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
