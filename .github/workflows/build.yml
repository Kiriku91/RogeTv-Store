name: Build & Auto-Deploy Roge Store APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Validasi & Konversi Gambar Drawable
        run: |
          mkdir -p app/src/main/res/drawable
          find app/src/main/res/drawable -type f ! \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) -delete
          python3 -m pip install --break-system-packages -q pillow || true
          python3 -c 'import os; from PIL import Image; d="app/src/main/res/drawable"; [ (Image.open(os.path.join(d,f)).convert("RGBA").save(os.path.join(d,os.path.splitext(f)[0].lower()+".png"),"PNG"), os.remove(os.path.join(d,f)) if not f.endswith(".png") or f!=f.lower() else None) for f in list(os.listdir(d)) if os.path.isfile(os.path.join(d,f)) ]; [ Image.new("RGBA",(64,64),(0,229,255,255)).save(os.path.join(d,n)) for n in ["logo.png","banner.png"] if not os.path.exists(os.path.join(d,n)) ]; print("Drawable OK:", os.listdir(d))'

      - name: Pastikan roge.keystore Permanen Tersedia
        run: |
          if [ ! -f "roge.keystore" ]; then
            keytool -genkey -v -keystore roge.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RogeStore, OU=TV, O=RogeProject, L=Padang, S=Sumbar, C=ID"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add roge.keystore
            git commit -m "Simpan roge.keystore permanen [skip ci]" || true
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || echo "Skip push keystore"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Clean & Build APK
        run: gradle clean assembleDebug --no-daemon

      - name: Kirim APK Otomatis ke VPS (rogeproject.my.id)
        run: |
          VER_CODE=$((1000 + ${{ github.run_number }}))
          RESPONSE=$(curl -s -X POST "https://rogeproject.my.id/store/admin.php" -F "github_auto_deploy=1" -F "secret_key=${{ secrets.STORE_SECRET }}" -F "version_code=$VER_CODE" -F "store_apk=@app/build/outputs/apk/debug/app-debug.apk")
          echo "Versi dikirim: $VER_CODE | Respon Server VPS: $RESPONSE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogeStore-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
