name: Build & Auto-Deploy Roge Store APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Buat Keystore Tetap (Agar Update APK Tidak Konflik Signature)
        run: |
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RogeStore, OU=TV, O=RogeProject, L=Padang, S=Sumbar, C=ID"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Kirim APK Otomatis ke VPS (rogeproject.my.id)
        run: |
          RESPONSE=$(curl -s -X POST "https://rogeproject.my.id/store/admin.php" \
            -F "github_auto_deploy=1" \
            -F "secret_key=${{ secrets.STORE_SECRET }}" \
            -F "version_code=${{ github.run_number }}" \
            -F "store_apk=@app/build/outputs/apk/debug/app-debug.apk")
          echo "Respon Server VPS: $RESPONSE"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogeStore-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
